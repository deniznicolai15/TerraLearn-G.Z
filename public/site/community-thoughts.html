<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Thoughts | TerraLearn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #17402A;
      --bg-dark: #0F2A1C;
      --fg: #F5F5F0;
      --primary: #8EB09A;
      --secondary: #B8C4BA;
      --muted: #6B7F73;
      --border: rgba(139, 176, 154, 0.3);
      --card-bg: rgba(15, 42, 28, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-dark) 100%);
      color: var(--fg);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* Back Button */
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      background: rgba(15, 42, 28, 0.6);
      border: 1px solid var(--border);
      border-radius: 50px;
      margin-bottom: 32px;
      transition: all 0.3s ease;
    }

    .back-button:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: rgba(26, 74, 46, 0.4);
      transform: translateX(-4px);
    }

    .back-button svg {
      width: 18px;
      height: 18px;
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .header-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary) 0%, #4B6B55 100%);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 8px 20px;
      border-radius: 50px;
      margin-bottom: 20px;
    }

    .page-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .page-subtitle {
      font-size: 16px;
      color: var(--secondary);
      max-width: 500px;
      margin: 0 auto;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 40px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      display: block;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Thoughts Grid */
    .thoughts-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .thought-card {
      background: linear-gradient(135deg, rgba(139, 176, 154, 0.08) 0%, rgba(75, 107, 85, 0.04) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      transition: all 0.3s ease;
      animation: fadeInUp 0.5s ease forwards;
      opacity: 0;
    }

    .thought-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .thought-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, #4B6B55 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .thought-meta {
      flex: 1;
    }

    .anonymous-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
    }

    .thought-time {
      font-size: 12px;
      color: var(--muted);
    }

    .thought-content {
      font-size: 15px;
      line-height: 1.8;
      color: var(--secondary);
      text-align: left;
    }

    .thought-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(139, 176, 154, 0.15);
    }

    .reaction-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid transparent;
      border-radius: 20px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .reaction-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(139, 176, 154, 0.1);
    }

    .reaction-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(139, 176, 154, 0.2);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      border: 1px dashed var(--border);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      color: var(--muted);
    }

    .empty-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--primary) 0%, #4B6B55 100%);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 50px;
      transition: all 0.3s ease;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(139, 176, 154, 0.4);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .stats-bar {
        gap: 20px;
        flex-wrap: wrap;
      }

      .stat-number {
        font-size: 24px;
      }

      .thought-card {
        padding: 20px;
      }

      .thought-footer {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Back Button -->
    <a href="javascript:history.back()" class="back-button">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Forest 101
    </a>

    <!-- Header -->
    <div class="page-header">
      <div class="header-badge">Community Voices</div>
      <h1 class="page-title">What Others Are Saying</h1>
      <p class="page-subtitle">Real thoughts from real people about protecting our forest mysteries</p>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-number" id="total-thoughts">0</span>
        <span class="stat-label">Thoughts Shared</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="total-reactions">0</span>
        <span class="stat-label">Total Reactions</span>
      </div>
    </div>

    <!-- Thoughts Grid -->
    <div class="thoughts-grid" id="thoughts-container">
      <!-- Thoughts will be loaded here -->
    </div>
  </div>

  <script>
    // Sample anonymous thoughts to start with (simulated community)
    const sampleThoughts = [
      {
        id: 1,
        content: "We have the responsibility to educate ourselves and others about the importance of forests. Biringan or not, these ecosystems are real treasures that need protection. Let's not wait until they become just legends too.",
        timestamp: Date.now() - 3600000 * 24 * 2,
        reactions: { fire: 12, heart: 8, leaf: 15 }
      },
      {
        id: 2,
        content: "Forests are like our ancestors' way of keeping secrets safe. Just like Biringan hides from those who don't respect it, our forests will disappear if we don't show them respect. It's our kababayan duty!",
        timestamp: Date.now() - 3600000 * 24,
        reactions: { fire: 7, heart: 14, leaf: 9 }
      },
      {
        id: 3,
        content: "ngl this made me think deeper... we always talk about protecting nature but do we actually do something? maybe we should start small like not using single-use plastics and supporting local conservation efforts fr fr",
        timestamp: Date.now() - 3600000 * 5,
        reactions: { fire: 21, heart: 6, leaf: 11 }
      },
      {
        id: 4,
        content: "The mystery of Biringan reminds me that there's still so much we don't know about our forests. That's why research and preservation are important - who knows what undiscovered species or knowledge we might lose?",
        timestamp: Date.now() - 3600000 * 12,
        reactions: { fire: 5, heart: 18, leaf: 22 }
      },
      {
        id: 5,
        content: "lowkey scared that our grandchildren might only see forests in pictures. we gotta step up and actually do something about deforestation. this hits different when you realize forests are literally keeping us alive",
        timestamp: Date.now() - 3600000 * 2,
        reactions: { fire: 16, heart: 11, leaf: 8 }
      }
    ];

    // Initialize thoughts from localStorage or use samples
    function initializeThoughts() {
      let communityThoughts = JSON.parse(localStorage.getItem('community-thoughts')) || [];
      
      // If no community thoughts exist, seed with sample thoughts
      if (communityThoughts.length === 0) {
        communityThoughts = [...sampleThoughts];
        localStorage.setItem('community-thoughts', JSON.stringify(communityThoughts));
      }
      
      return communityThoughts;
    }

    // Format time ago
    function timeAgo(timestamp) {
      const seconds = Math.floor((Date.now() - timestamp) / 1000);
      
      if (seconds < 60) return 'just now';
      if (seconds < 3600) return Math.floor(seconds / 60) + ' minutes ago';
      if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
      if (seconds < 604800) return Math.floor(seconds / 86400) + ' days ago';
      return new Date(timestamp).toLocaleDateString();
    }

    // Generate random avatar initial
    function getRandomInitial() {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      return letters[Math.floor(Math.random() * letters.length)];
    }

    // Render thoughts
    function renderThoughts() {
      const container = document.getElementById('thoughts-container');
      const thoughts = initializeThoughts();
      
      // Sort by newest first
      thoughts.sort((a, b) => b.timestamp - a.timestamp);
      
      // Update stats
      document.getElementById('total-thoughts').textContent = thoughts.length;
      
      let totalReactions = 0;
      thoughts.forEach(t => {
        if (t.reactions) {
          totalReactions += (t.reactions.fire || 0) + (t.reactions.heart || 0) + (t.reactions.leaf || 0);
        }
      });
      document.getElementById('total-reactions').textContent = totalReactions;
      
      if (thoughts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <h3 class="empty-title">No thoughts yet</h3>
            <p class="empty-text">Be the first to share your thoughts about protecting our forests!</p>
            <a href="javascript:history.back()" class="cta-btn">
              Share Your Thought
            </a>
          </div>
        `;
        return;
      }
      
      container.innerHTML = thoughts.map((thought, index) => `
        <div class="thought-card" style="animation-delay: ${index * 0.1}s">
          <div class="thought-header">
            <div class="avatar">${getRandomInitial()}</div>
            <div class="thought-meta">
              <div class="anonymous-label">Anonymous Earthling</div>
              <div class="thought-time">${timeAgo(thought.timestamp)}</div>
            </div>
          </div>
          <p class="thought-content">${thought.content}</p>
          <div class="thought-footer">
            <button class="reaction-btn" data-id="${thought.id}" data-type="fire">
              <span>&#128293;</span> ${thought.reactions?.fire || 0}
            </button>
            <button class="reaction-btn" data-id="${thought.id}" data-type="heart">
              <span>&#128154;</span> ${thought.reactions?.heart || 0}
            </button>
            <button class="reaction-btn" data-id="${thought.id}" data-type="leaf">
              <span>&#127807;</span> ${thought.reactions?.leaf || 0}
            </button>
          </div>
        </div>
      `).join('');
      
      // Add reaction listeners
      document.querySelectorAll('.reaction-btn').forEach(btn => {
        btn.addEventListener('click', handleReaction);
      });
    }

    // Handle reaction click
    function handleReaction(e) {
      const btn = e.currentTarget;
      const thoughtId = parseInt(btn.dataset.id);
      const reactionType = btn.dataset.type;
      
      let thoughts = JSON.parse(localStorage.getItem('community-thoughts')) || [];
      const thoughtIndex = thoughts.findIndex(t => t.id === thoughtId);
      
      if (thoughtIndex !== -1) {
        if (!thoughts[thoughtIndex].reactions) {
          thoughts[thoughtIndex].reactions = { fire: 0, heart: 0, leaf: 0 };
        }
        thoughts[thoughtIndex].reactions[reactionType]++;
        localStorage.setItem('community-thoughts', JSON.stringify(thoughts));
        
        // Toggle active state
        btn.classList.add('active');
        
        // Re-render
        renderThoughts();
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', renderThoughts);
  </script>
</body>
</html>
